<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Astro+ Tools</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #212121;
        color: #f0f0f0;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
    }

    .container {
        background-color: #2d2d2d;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        max-width: 460px;
        width: 100%;
        display: flex;
        flex-direction: column;
    }

    .home-button {
        position: fixed;
        top: 10px;
        left: 10px;
        background-color: #2d2d2d;
        color: #f0f0f0;
        padding: 6px 12px;
        font-size: 14px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        text-decoration: none;
        user-select: none;
        transition: background-color 0.3s ease, color 0.3s ease, transform 0.15s ease;
        z-index: 1000;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    .home-button:hover,
    .home-button:focus {
        background-color: #28a745;
        color: #121212;
    }

    h1 {
        color: #fff;
        text-align: center;
        margin-top: 10px;
        margin-bottom: 30px;
    }

    .fields-group {
        display: flex;
        gap: 20px;
        margin-bottom: 30px;
    }

    .fields-group > div {
        flex: 1;
        display: flex;
        flex-direction: column;
    }

    label {
        color: #ddd;
        font-weight: bold;
        margin-bottom: 8px;
    }

    input[type="number"] {
        background-color: #333;
        border: 1px solid #444;
        border-radius: 5px;
        padding: 10px 15px;
        color: #fff;
        font-size: 16px;
        box-sizing: border-box;
        margin-bottom: 0;
        width: 100%;
    }

    input[type="number"]::placeholder {
        color: #888;
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    input[type=number] {
      -moz-appearance: textfield;
    }

    input[type="number"]:focus {
        border-color: #0a84ff;
        outline: none;
    }

    button {
        background-color: #0a84ff;
        border: none;
        border-radius: 5px;
        color: white;
        font-size: 18px;
        padding: 12px;
        cursor: pointer;
        transition: background-color 0.3s;
        width: 100%;
    }

    button:hover {
        background-color: #0061c2;
    }

    #popup {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #333;
        padding: 15px 25px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        font-size: 16px;
        color: white;
        display: none;
        z-index: 10000;
        user-select: none;
    }

    #popup.success {
        background-color: #28a745;
    }

    #popup.error {
        background-color: #dc3545;
    }
</style>
</head>
<body>

<a href="/" class="home-button">Home</a>

<div class="container">
    <h1>Auto-Group Joiner</h1>

    <div class="fields-group">
        <div>
            <label for="start">Starting Group ID</label>
            <input type="number" id="start" placeholder="Enter Starting Group ID" min="1" />
        </div>
        <div>
            <label for="end">Ending Group ID</label>
            <input type="number" id="end" placeholder="Enter Ending Group ID" min="1" />
        </div>
    </div>

    <button id="copyButton" onclick="copyScript()">Copy to Clipboard</button>
</div>

<div id="popup"></div>

<script>
    let popupTimeout;

    function showPopup(message, type) {
        const popup = document.getElementById("popup");
        popup.textContent = message;
        popup.className = type;
        popup.style.display = "block";

        clearTimeout(popupTimeout);
        popupTimeout = setTimeout(() => {
            popup.style.display = "none";
        }, 3000);
    }

    function enforcePositiveInteger(input) {
        let val = input.value.replace(/\D/g, '');
        val = val.replace(/^0+/, '');
        input.value = val;
    }

    document.getElementById('start').addEventListener('input', function() {
        enforcePositiveInteger(this);
    });

    document.getElementById('end').addEventListener('input', function() {
        enforcePositiveInteger(this);
    });

    function copyScript() {
        const start = document.getElementById("start").value.trim();
        const end = document.getElementById("end").value.trim();

        if (!start || !end) {
            showPopup("Both fields must be filled out", "error");
            return;
        }

        if (parseInt(start) > parseInt(end)) {
            showPopup("Starting Group ID must be less than or equal to Ending Group ID", "error");
            return;
        }

        const script = `
(() => {
  const startGroup = ${start};
  const endGroup = ${end};

  const sleep = ms => new Promise(res => setTimeout(res, ms));

  const tokenInput = document.querySelector('input[name="_token"]');
  const token = tokenInput.value;

  async function joinGroup(groupId) {
    await fetch(\`https://www.brickplanet.com/groups/\${groupId}/join\`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ _token: token })
    });
    console.log("Joined Group " + groupId);
  }

  (async () => {
    for (let group = startGroup; group <= endGroup; group++) {
      await joinGroup(group);
      await sleep(5000);
    }
    console.log("Groups " + startGroup + "-" + endGroup + " Successfully Joined!");
  })();
})();
        `.trim();

        navigator.clipboard.writeText(script).then(() => {
            showPopup("Paste this into BrickPlanet's Console (CTRL + SHIFT + I)", "success");
        }).catch(() => {
            showPopup("Both fields must be filled out", "error");
        });
    }
</script>

</body>
</html>
